 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Encuesta - Pregunta 1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <div class="screen">
      <h2>Pregunta 1</h2>
      <p>¿Crees que la IA reemplazará empleos?</p>

      <form action="pagina2.html" method="post">
        <label><input type="radio" name="empleos" value="Sí"> Sí</label><br>
        <label><input type="radio" name="empleos" value="No"> No</label><br>
        <label><input type="radio" name="empleos" value="Tal vez"> Tal vez</label><br><br>

        <label for="justificacion">Justifica tu respuesta:</label><br>
        <textarea id="justificacion" name="justificacion" rows="4" cols="30" placeholder="Escribe tu justificación aquí..."></textarea>

        <div class="buttons">
          <a href="index.html"><button type="button" class="exit">Cancelar</button></a>
          <button type="button" disabled>Página anterior</button>
          <button type="submit" class="start">Siguiente</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
